<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나만의 영화 티어리스트</title>
<style>
  :root {
    --bg: #05060b;
    --navy: #0b1122;
    --navy-2: #111a33;
    --navy-3: #18244a;
    --line: #1e2a4c;
    --text: #ece8df;
    --muted: #96a0bb;
    --dim: #5b6584;
    --accent: #f0c46e;
    --accent-soft: rgba(240, 196, 110, 0.13);
    --danger: #f08b7a;
    --ok: #8fd1b4;
    --tier-s: #f0c46e;
    --tier-a: #e9917b;
    --tier-b: #7db7c8;
    --tier-c: #a7a0d8;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }

  body {
    min-height: 100vh;
    color: var(--text);
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse 70% 35% at 50% -6%, rgba(240, 196, 110, 0.16), transparent 70%),
      linear-gradient(180deg, #0a0f20 0%, var(--bg) 55%);
    background-attachment: fixed;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
    line-height: 1.5;
    word-break: keep-all;
  }
  body.modal-open { overflow: hidden; }

  .wrap {
    max-width: 1000px;
    margin: 0 auto;
    padding: 36px 16px 56px;
  }

  /* ---------- 헤더 ---------- */
  header { text-align: center; margin-bottom: 28px; }
  h1 {
    margin: 0;
    font-size: clamp(1.55rem, 5.5vw, 2.3rem);
    letter-spacing: 0.04em;
    text-shadow: 0 0 26px rgba(240, 196, 110, 0.35);
  }
  .screen {
    width: min(560px, 82%);
    height: 5px;
    margin: 16px auto 14px;
    border-radius: 50%;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    box-shadow: 0 0 28px 6px rgba(240, 196, 110, 0.22);
    opacity: 0.85;
  }
  .guide { margin: 0; color: var(--muted); font-size: 0.92rem; }

  /* ---------- 등급 칸 ---------- */
  .tiers { display: flex; flex-direction: column; gap: 10px; }

  .tier {
    display: grid;
    grid-template-columns: 76px 1fr;
    min-height: 78px;
    background: var(--navy);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .tier-label {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.9rem;
    font-weight: 800;
    color: #0a0d18;
    background: var(--tc);
    box-shadow: inset -10px 0 18px -12px rgba(0, 0, 0, 0.5);
  }
  .tier[data-tier="S"] { --tc: var(--tier-s); }
  .tier[data-tier="A"] { --tc: var(--tier-a); }
  .tier[data-tier="B"] { --tc: var(--tier-b); }
  .tier[data-tier="C"] { --tc: var(--tier-c); }

  .zone {
    display: flex;
    flex-wrap: wrap;
    align-content: flex-start;
    gap: 8px;
    min-width: 0;
    min-height: 78px;
    padding: 10px;
  }
  .zone:empty::before {
    content: attr(data-empty);
    align-self: center;
    color: var(--dim);
    font-size: 0.85rem;
  }

  .drop-over {
    border-color: var(--accent) !important;
    box-shadow: 0 0 0 1px var(--accent), 0 0 22px rgba(240, 196, 110, 0.25);
  }
  .drop-over .zone, .zone.drop-over { background: var(--accent-soft); }

  /* ---------- 미분류 ---------- */
  .unsorted {
    margin-top: 28px;
    padding: 18px 16px 16px;
    background: linear-gradient(180deg, var(--navy) 0%, #080d1b 100%);
    border: 1px solid var(--line);
    border-radius: 14px;
  }
  .unsorted-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }
  .unsorted h2 { margin: 0; font-size: 1.15rem; }
  .count { color: var(--muted); font-weight: 400; font-size: 0.9rem; margin-left: 4px; }

  .add-form { display: flex; flex-wrap: wrap; gap: 8px; flex: 1 1 280px; max-width: 460px; }
  .add-form input {
    flex: 1 1 180px;
    min-width: 0;
    padding: 10px 12px;
    color: var(--text);
    background: #070b17;
    border: 1px solid #2a3762;
    border-radius: 8px;
    font: inherit;
  }
  .add-form input::placeholder { color: var(--dim); }
  .add-form input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  .btn {
    padding: 10px 16px;
    border-radius: 8px;
    border: 1px solid transparent;
    font: inherit;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-primary { background: var(--accent); color: #17120a; }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-ghost { background: transparent; color: var(--muted); border-color: #2a3762; }
  .btn-ghost:hover { color: var(--danger); border-color: var(--danger); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .message { min-height: 1.5em; margin: 0 0 10px; font-size: 0.9rem; }
  .message.error { color: var(--danger); }
  .message.ok { color: var(--ok); }

  .unsorted .zone {
    padding: 12px;
    min-height: 90px;
    background: rgba(5, 8, 18, 0.6);
    border: 1px dashed #26325a;
    border-radius: 10px;
  }

  /* ---------- 영화 카드 ---------- */
  .card {
    display: inline-flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
    max-width: 100%;
    padding: 8px 13px;
    color: var(--text);
    background: linear-gradient(180deg, var(--navy-3), var(--navy-2));
    border: 1px solid #2b3968;
    border-radius: 8px;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.45);
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
    overflow-wrap: anywhere;
    transition: border-color 0.15s, transform 0.15s;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card.dragging { opacity: 0.4; cursor: grabbing; }
  .card-title { font-size: 0.95rem; font-weight: 600; }
  .card-stars { color: var(--accent); font-size: 0.72rem; letter-spacing: 1px; }

  .footer-bar { display: flex; justify-content: flex-end; margin-top: 20px; }

  /* ---------- 상세 영역 ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(2, 3, 8, 0.72);
    backdrop-filter: blur(3px);
  }
  .overlay[hidden] { display: none; }

  .dialog {
    width: min(460px, 100%);
    max-height: calc(100vh - 32px);
    overflow-y: auto;
    padding: 20px;
    background: var(--navy);
    border: 1px solid #2b3968;
    border-radius: 14px;
    box-shadow: 0 0 40px rgba(240, 196, 110, 0.12), 0 20px 50px rgba(0, 0, 0, 0.6);
  }
  .dialog-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .dialog-head h2 { margin: 0; font-size: 1.25rem; overflow-wrap: anywhere; }
  .icon-btn {
    flex: none;
    width: 34px;
    height: 34px;
    border: 1px solid #2b3968;
    border-radius: 8px;
    color: var(--muted);
    background: transparent;
    font-size: 1rem;
    cursor: pointer;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--muted); }
  .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .field { margin-bottom: 16px; }
  .field-label { display: block; margin-bottom: 6px; font-size: 0.9rem; font-weight: 700; color: var(--muted); }
  .opt { font-weight: 400; color: var(--dim); }

  .dialog select, .dialog textarea {
    width: 100%;
    padding: 10px 12px;
    color: var(--text);
    background: #070b17;
    border: 1px solid #2a3762;
    border-radius: 8px;
    font: inherit;
  }
  .dialog select:focus, .dialog textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .dialog textarea { resize: vertical; min-height: 96px; }

  .star-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .stars-input { display: flex; gap: 2px; }
  .star-btn {
    width: 40px;
    height: 40px;
    padding: 0;
    border: none;
    background: transparent;
    color: #3a4670;
    font-size: 1.75rem;
    line-height: 1;
    cursor: pointer;
    transition: color 0.12s, transform 0.12s;
  }
  .star-btn.on { color: var(--accent); text-shadow: 0 0 10px rgba(240, 196, 110, 0.45); }
  .star-btn:hover { transform: scale(1.12); }
  .star-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 6px; }
  .rating-text { color: var(--text); font-size: 0.92rem; min-width: 4.5em; }
  .text-btn {
    padding: 4px 6px;
    border: none;
    background: none;
    color: var(--muted);
    font: inherit;
    font-size: 0.85rem;
    text-decoration: underline;
    cursor: pointer;
  }
  .text-btn:disabled { color: var(--dim); text-decoration: none; cursor: default; }
  .text-btn:focus-visible { outline: 2px solid var(--accent); border-radius: 4px; }

  .saved-note { margin: 0; color: var(--dim); font-size: 0.82rem; }

  /* ---------- 좁은 화면 ---------- */
  @media (max-width: 560px) {
    .wrap { padding-top: 26px; }
    .tier { grid-template-columns: 50px 1fr; min-height: 68px; }
    .tier-label { font-size: 1.45rem; }
    .zone { padding: 8px; gap: 6px; min-height: 68px; }
    .card { padding: 7px 10px; }
    .card-title { font-size: 0.9rem; }
    .add-form { max-width: none; }
    .overlay { align-items: flex-end; padding: 0; }
    .dialog { width: 100%; max-height: 88vh; border-radius: 16px 16px 0 0; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>나만의 영화 티어리스트</h1>
      <div class="screen" aria-hidden="true"></div>
      <p class="guide">카드를 끌어 등급 칸에 놓거나, 카드를 눌러 등급·별점·메모를 정할 수 있어요.</p>
    </header>

    <main>
      <section class="tiers" aria-label="등급별 영화">
        <div class="tier" data-tier="S">
          <div class="tier-label">S</div>
          <div class="zone" data-zone="S" data-empty="S등급 영화를 여기에 놓아 주세요"></div>
        </div>
        <div class="tier" data-tier="A">
          <div class="tier-label">A</div>
          <div class="zone" data-zone="A" data-empty="A등급 영화를 여기에 놓아 주세요"></div>
        </div>
        <div class="tier" data-tier="B">
          <div class="tier-label">B</div>
          <div class="zone" data-zone="B" data-empty="B등급 영화를 여기에 놓아 주세요"></div>
        </div>
        <div class="tier" data-tier="C">
          <div class="tier-label">C</div>
          <div class="zone" data-zone="C" data-empty="C등급 영화를 여기에 놓아 주세요"></div>
        </div>
      </section>

      <section class="unsorted" aria-labelledby="unsortedTitle">
        <div class="unsorted-head">
          <h2 id="unsortedTitle">미분류 <span class="count" id="unsortedCount"></span></h2>
          <form class="add-form" id="addForm" autocomplete="off">
            <label for="titleInput" class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">영화 제목</label>
            <input id="titleInput" type="text" maxlength="100" placeholder="영화 제목 입력">
            <button class="btn btn-primary" type="submit">추가</button>
          </form>
        </div>
        <p class="message" id="message" role="status" aria-live="polite"></p>
        <div class="zone" data-zone="U" data-empty="아직 등급을 정하지 않은 영화가 없어요"></div>
      </section>

      <div class="footer-bar">
        <button class="btn btn-ghost" type="button" id="resetBtn">전체 초기화</button>
      </div>
    </main>
  </div>

  <!-- 상세 영역 -->
  <div class="overlay" id="overlay" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
      <div class="dialog-head">
        <h2 id="detailTitle"></h2>
        <button class="icon-btn" type="button" id="closeBtn" aria-label="닫기">✕</button>
      </div>

      <div class="field">
        <label class="field-label" for="tierSelect">등급</label>
        <select id="tierSelect">
          <option value="S">S</option>
          <option value="A">A</option>
          <option value="B">B</option>
          <option value="C">C</option>
          <option value="U">미분류</option>
        </select>
      </div>

      <div class="field">
        <span class="field-label">별점 <span class="opt">(선택)</span></span>
        <div class="star-row">
          <div class="stars-input" id="starsInput" aria-label="별점 선택"></div>
          <span class="rating-text" id="ratingText"></span>
          <button class="text-btn" type="button" id="clearRating">별점 지우기</button>
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="memoInput">메모 <span class="opt">(선택)</span></label>
        <textarea id="memoInput" rows="4" placeholder="감상평이나 추천 이유를 짧게 적어 보세요"></textarea>
      </div>

      <p class="saved-note">변경 내용은 자동으로 저장돼요.</p>
    </div>
  </div>

<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'my-movie-tierlist-v1';
  var INITIAL_TITLES = [
    '인사이드 아웃', '나우 유 씨 미', '뷰티 인사이드', '기생충',
    '라라랜드', '해리포터', '왕과 사는 남자', '나의 소녀시대'
  ];
  var VALID_TIERS = ['S', 'A', 'B', 'C', 'U'];

  var state;
  var currentId = null;
  var dragId = null;
  var saveWarned = false;

  // ---------- 요소 ----------
  var zones = {};
  document.querySelectorAll('[data-zone]').forEach(function (z) { zones[z.dataset.zone] = z; });
  var unsortedCount = document.getElementById('unsortedCount');
  var addForm = document.getElementById('addForm');
  var titleInput = document.getElementById('titleInput');
  var message = document.getElementById('message');
  var resetBtn = document.getElementById('resetBtn');
  var overlay = document.getElementById('overlay');
  var dialog = overlay.querySelector('.dialog');
  var detailTitle = document.getElementById('detailTitle');
  var closeBtn = document.getElementById('closeBtn');
  var tierSelect = document.getElementById('tierSelect');
  var starsInput = document.getElementById('starsInput');
  var ratingText = document.getElementById('ratingText');
  var clearRating = document.getElementById('clearRating');
  var memoInput = document.getElementById('memoInput');

  // ---------- 상태 / 저장 ----------
  function makeId() {
    return 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function initialState() {
    return {
      movies: INITIAL_TITLES.map(function (t, i) {
        return { id: 'init-' + i, title: t, tier: 'U', rating: null, memo: '' };
      })
    };
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return initialState();
      var data = JSON.parse(raw);
      if (!data || !Array.isArray(data.movies)) return initialState();
      var seen = {};
      var movies = [];
      data.movies.forEach(function (m) {
        if (!m || typeof m.title !== 'string' || !m.title.trim()) return;
        var id = (typeof m.id === 'string' && !seen[m.id]) ? m.id : makeId();
        seen[id] = true;
        movies.push({
          id: id,
          title: m.title.trim(),
          tier: VALID_TIERS.indexOf(m.tier) >= 0 ? m.tier : 'U',
          rating: (Number.isInteger(m.rating) && m.rating >= 1 && m.rating <= 5) ? m.rating : null,
          memo: typeof m.memo === 'string' ? m.memo : ''
        });
      });
      return { movies: movies };
    } catch (e) {
      return initialState();
    }
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      if (!saveWarned) {
        showMessage('브라우저 저장소를 사용할 수 없어 변경 내용이 저장되지 않아요.', 'error');
        saveWarned = true;
      }
    }
  }

  function findMovie(id) {
    for (var i = 0; i < state.movies.length; i++) {
      if (state.movies[i].id === id) return state.movies[i];
    }
    return null;
  }

  // ---------- 화면 그리기 ----------
  function render() {
    Object.keys(zones).forEach(function (k) { zones[k].replaceChildren(); });
    var unsorted = 0;
    state.movies.forEach(function (m) {
      zones[m.tier].appendChild(makeCard(m));
      if (m.tier === 'U') unsorted++;
    });
    unsortedCount.textContent = '(' + unsorted + ')';
  }

  function makeCard(m) {
    var card = document.createElement('div');
    card.className = 'card';
    card.setAttribute('role', 'button');
    card.tabIndex = 0;
    card.draggable = true;
    card.dataset.id = m.id;

    var title = document.createElement('span');
    title.className = 'card-title';
    title.textContent = m.title;
    card.appendChild(title);

    if (m.rating) {
      var stars = document.createElement('span');
      stars.className = 'card-stars';
      stars.textContent = '★'.repeat(m.rating) + '☆'.repeat(5 - m.rating);
      stars.setAttribute('aria-label', '별점 ' + m.rating + '점');
      card.appendChild(stars);
    }

    card.addEventListener('click', function () { openDetail(m.id); });
    card.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        openDetail(m.id);
      }
    });
    card.addEventListener('dragstart', function (e) {
      dragId = m.id;
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', m.id); } catch (err) {}
      card.classList.add('dragging');
    });
    card.addEventListener('dragend', function () {
      card.classList.remove('dragging');
      dragId = null;
      clearDropHighlight();
    });
    return card;
  }

  // ---------- 이동 ----------
  function moveTo(id, tier) {
    if (VALID_TIERS.indexOf(tier) < 0) return;
    var idx = -1;
    for (var i = 0; i < state.movies.length; i++) {
      if (state.movies[i].id === id) { idx = i; break; }
    }
    if (idx < 0) return;
    var movie = state.movies[idx];
    if (movie.tier === tier) return;
    state.movies.splice(idx, 1);
    movie.tier = tier;
    state.movies.push(movie);
    save();
    render();
    if (currentId === id) tierSelect.value = tier;
  }

  // ---------- 드래그 앤 드롭 ----------
  function clearDropHighlight() {
    document.querySelectorAll('.drop-over').forEach(function (el) { el.classList.remove('drop-over'); });
  }

  function setupDropTarget(target, tier) {
    target.addEventListener('dragover', function (e) {
      if (!dragId) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      target.classList.add('drop-over');
    });
    target.addEventListener('dragleave', function (e) {
      if (!target.contains(e.relatedTarget)) target.classList.remove('drop-over');
    });
    target.addEventListener('drop', function (e) {
      e.preventDefault();
      var id = dragId || e.dataTransfer.getData('text/plain');
      clearDropHighlight();
      dragId = null;
      if (id) moveTo(id, tier);
    });
  }

  document.querySelectorAll('.tier').forEach(function (row) { setupDropTarget(row, row.dataset.tier); });
  setupDropTarget(zones.U, 'U');

  // ---------- 안내 문구 ----------
  function showMessage(text, type) {
    message.textContent = text;
    message.className = 'message' + (type ? ' ' + type : '');
  }

  // ---------- 영화 추가 ----------
  function normalizeTitle(s) {
    return s.replace(/\s+/g, '').toLowerCase();
  }

  addForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var title = titleInput.value.replace(/\s+/g, ' ').trim();
    if (!title) {
      showMessage('영화 제목을 입력해 주세요. 공백만으로는 추가할 수 없어요.', 'error');
      titleInput.value = '';
      titleInput.focus();
      return;
    }
    var key = normalizeTitle(title);
    var exists = state.movies.some(function (m) { return normalizeTitle(m.title) === key; });
    if (exists) {
      showMessage('\'' + title + '\'은(는) 이미 목록에 있는 영화예요.', 'error');
      titleInput.focus();
      return;
    }
    state.movies.push({ id: makeId(), title: title, tier: 'U', rating: null, memo: '' });
    save();
    render();
    titleInput.value = '';
    titleInput.focus();
    showMessage('\'' + title + '\'을(를) 미분류에 추가했어요.', 'ok');
  });

  titleInput.addEventListener('input', function () {
    if (message.textContent) showMessage('', '');
  });

  // ---------- 전체 초기화 ----------
  resetBtn.addEventListener('click', function () {
    var ok = window.confirm('전체 초기화를 하면 추가한 영화와 별점·메모가 모두 삭제되고,\n처음 영화 8개가 미분류로 돌아가요.\n\n초기화할까요?');
    if (!ok) return;
    closeDetail(false);
    state = initialState();
    save();
    render();
    titleInput.value = '';
    showMessage('초기화했어요. 처음 영화 8개가 미분류로 돌아왔어요.', 'ok');
  });

  // ---------- 상세 영역 ----------
  var starButtons = [];
  for (var s = 1; s <= 5; s++) {
    (function (value) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'star-btn';
      b.textContent = '★';
      b.setAttribute('aria-label', value + '점');
      b.addEventListener('click', function () { setRating(value); });
      starsInput.appendChild(b);
      starButtons.push(b);
    })(s);
  }

  function paintStars(rating) {
    starButtons.forEach(function (b, i) {
      var on = rating !== null && i < rating;
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', rating === i + 1 ? 'true' : 'false');
    });
    ratingText.textContent = rating ? rating + '점' : '별점 없음';
    clearRating.disabled = !rating;
  }

  function setRating(value) {
    var m = findMovie(currentId);
    if (!m) return;
    m.rating = value;
    save();
    paintStars(m.rating);
    render();
  }

  clearRating.addEventListener('click', function () { setRating(null); });

  memoInput.addEventListener('input', function () {
    var m = findMovie(currentId);
    if (!m) return;
    m.memo = memoInput.value;
    save();
  });

  tierSelect.addEventListener('change', function () {
    if (currentId) moveTo(currentId, tierSelect.value);
  });

  function openDetail(id) {
    var m = findMovie(id);
    if (!m) return;
    currentId = id;
    detailTitle.textContent = m.title;
    tierSelect.value = m.tier;
    memoInput.value = m.memo;
    paintStars(m.rating);
    overlay.hidden = false;
    document.body.classList.add('modal-open');
    tierSelect.focus();
  }

  function closeDetail(restoreFocus) {
    if (overlay.hidden) return;
    var id = currentId;
    overlay.hidden = true;
    document.body.classList.remove('modal-open');
    currentId = null;
    if (restoreFocus !== false && id) {
      var cards = document.querySelectorAll('.card');
      for (var i = 0; i < cards.length; i++) {
        if (cards[i].dataset.id === id) { cards[i].focus(); break; }
      }
    }
  }

  closeBtn.addEventListener('click', function () { closeDetail(); });
  overlay.addEventListener('click', function (e) {
    if (e.target === overlay) closeDetail();
  });

  document.addEventListener('keydown', function (e) {
    if (overlay.hidden) return;
    if (e.key === 'Escape') {
      e.preventDefault();
      closeDetail();
      return;
    }
    if (e.key === 'Tab') {
      var focusables = Array.prototype.filter.call(
        dialog.querySelectorAll('button, select, textarea'),
        function (el) { return !el.disabled; }
      );
      if (!focusables.length) return;
      var first = focusables[0];
      var last = focusables[focusables.length - 1];
      if (e.shiftKey && document.activeElement === first) {
        e.preventDefault(); last.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault(); first.focus();
      }
    }
  });

  // ---------- 시작 ----------
  state = load();
  render();
})();
</script>
</body>
</html>
