<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>나만의 영화 티어리스트</title>
<style>
:root{color-scheme:dark;--bg:#080708;--panel:#151012;--panel2:#1e1518;--line:#453039;--text:#f8f2f1;--muted:#b5a5a8;--red:#8d253d;--red-bright:#c85c70;--gold:#e8c4a1}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;background:radial-gradient(ellipse 85% 460px at 50% -160px,#4a1828 0%,#1a0d13 48%,transparent 100%),linear-gradient(180deg,#100c0e 0%,#080708 75%)}
main{max-width:1180px;margin:0 auto;padding:46px 20px 76px}
header{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:31px;padding-bottom:25px;border-bottom:1px solid #49303a}
h1{font-size:clamp(26px,4vw,40px);letter-spacing:-1.3px;line-height:1.2;margin:0;font-weight:800}
header p{color:var(--muted);margin:12px 0 0;font-size:14px}
.eyebrow{display:block;color:#d48b99;font-size:11px;font-weight:800;letter-spacing:3px;margin-bottom:13px}
button,input,select,textarea{font:inherit}button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.movie:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.reset{background:#24151a;color:#f2c7cf;border:1px solid #74404d;border-radius:9px;padding:11px 16px;white-space:nowrap}
.reset:hover,.secondary:hover{background:#3b2029}
.tier{display:grid;grid-template-columns:70px minmax(0,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:11px;background:linear-gradient(115deg,#1b1316,#120e10);min-height:76px;box-shadow:0 8px 32px #0003}
.tier-label{display:flex;align-items:center;justify-content:center;font-size:27px;font-weight:850;color:#fff;background:#552031;border-right:1px solid #62404a}
.tier[data-tier="S"] .tier-label{background:#7a233b;color:#ffe2de}
.tier[data-tier="A"] .tier-label{background:#672338;color:#ffd7dc}
.tier[data-tier="B"] .tier-label{background:#492131;color:#f2ccd4}
.tier[data-tier="C"] .tier-label{background:#36202b;color:#e7c4cc}
.tier[data-tier="미분류"] .tier-label{background:#2d2228;color:#e9d9dd;font-size:13px}
.drop{padding:11px 13px;display:flex;align-content:flex-start;align-items:center;flex-wrap:wrap;gap:9px;min-width:0;transition:background .15s,box-shadow .15s}
.drop.over{background:#3e1926;box-shadow:inset 0 0 0 2px var(--red-bright)}
.movie{position:relative;display:flex;align-items:center;flex:0 1 auto;min-width:112px;max-width:100%;min-height:45px;padding:8px 13px 8px 15px;overflow:hidden;border:1px solid #65404b;border-radius:8px;color:#fff;text-align:left;cursor:grab;background:linear-gradient(110deg,#37202a,#23171c);box-shadow:0 2px 8px #0005;transition:transform .16s,border-color .16s,background .16s}
.movie::before{content:"";position:absolute;top:7px;bottom:7px;left:0;width:3px;border-radius:0 2px 2px 0;background:#bd5d72}
.movie:hover{transform:translateY(-2px);border-color:#da8a9a;background:linear-gradient(110deg,#482532,#2b1a21)}
.movie:active{cursor:grabbing}
.poster-art,.poster-top{display:none}
.poster-bottom{display:flex;flex-direction:column;gap:2px;min-width:0}
.poster-title{display:block;font-size:13px;font-weight:750;line-height:1.35;overflow-wrap:anywhere;word-break:keep-all}
.poster-rating{font-size:11px;color:#f2c597;line-height:1.3}
.empty{color:#917e85;font-size:13px;align-self:center}
.section-title{font-size:20px;margin:35px 0 16px;color:#f0d5d9;letter-spacing:-.5px}
.add{display:flex;gap:10px;flex-wrap:wrap}
.add input{flex:1;min-width:160px;background:#1b1316;color:white;border:1px solid #68404d;border-radius:9px;padding:13px}
.add input::placeholder,textarea::placeholder{color:#9c878f}
.primary{border:1px solid #ba4960;background:#8d253d;color:#fff;font-weight:750;border-radius:9px;padding:12px 21px}
.primary:hover{background:#a62d49}
.message{min-height:22px;color:#f4a4b1;margin:10px 0 0;font-size:14px}
dialog{width:min(460px,calc(100% - 30px));max-height:calc(100dvh - 30px);overflow-y:auto;border:1px solid #74414f;border-radius:15px;padding:25px;background:#1b1217;color:var(--text);box-shadow:0 25px 90px #000d}
dialog::backdrop{background:#000c}
dialog h2{margin:0 0 20px;font-size:23px;overflow-wrap:anywhere}
dialog label{display:block;margin:16px 0 7px;color:#ead7dd;font-size:14px}
dialog select,dialog textarea{width:100%;background:#110c10;color:white;border:1px solid #704550;border-radius:9px;padding:11px}
dialog textarea{min-height:100px;resize:vertical}
.stars{display:flex;flex-wrap:wrap;gap:7px}
.stars button{background:#291a22;color:#cfbbc0;border:1px solid #704550;border-radius:8px;padding:8px 11px}
.stars button.active{color:#ffe1a0;border-color:#c88c66;background:#4b3034}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
.secondary{background:transparent;color:#e7d7db;border:1px solid #704550;border-radius:9px;padding:11px 17px}
@media(max-width:560px){main{padding:25px 11px 55px}header{align-items:flex-start;gap:14px}.tier{grid-template-columns:49px minmax(0,1fr);min-height:68px}.tier-label{font-size:23px}.tier[data-tier="미분류"] .tier-label{font-size:11px;writing-mode:vertical-rl}.drop{padding:9px;gap:7px}.movie{min-width:0;min-height:41px;padding:7px 10px 7px 12px}.poster-title{font-size:12px}.empty{font-size:12px}}
</style>
</head>
<body><main><header><div><span class="eyebrow">MY CINEMA · TIER LIST</span><h1>나만의 영화 티어리스트</h1><p>내가 본 영화를 취향대로 분류하고 기록해 보세요.</p></div><button class="reset" id="reset">전체 초기화</button></header><section id="tiers" aria-label="영화 등급별 목록"></section><h2 class="section-title">영화 추가</h2><form id="add" class="add"><input id="title" aria-label="새 영화 제목" placeholder="영화 제목을 입력하세요" autocomplete="off"><button class="primary">추가</button></form><p class="message" id="message" role="status"></p></main>
<dialog id="detail"><form method="dialog" id="detailForm"><h2 id="detailTitle"></h2><label for="grade">등급</label><select id="grade"><option>미분류</option><option>S</option><option>A</option><option>B</option><option>C</option></select><label>별점 (선택)</label><div class="stars" id="stars" aria-label="별점 선택"></div><label for="memo">짧은 감상평 또는 추천 이유 (선택)</label><textarea id="memo" placeholder="감상평이나 추천 이유를 적어 보세요"></textarea><div class="actions"><button type="button" class="secondary" id="close">취소</button><button class="primary" value="save">저장</button></div></form></dialog>
<script>
(()=>{'use strict';const initial=['인사이드 아웃','나우 유 씨 미','뷰티 인사이드','기생충','라라랜드','해리포터','왕과 사는 남자','나의 소녀시대'];const grades=['S','A','B','C','미분류'];const key='my-movie-tier-list-v1';const fresh=()=>initial.map((title,i)=>({id:'initial-'+i,title,grade:'미분류',rating:null,memo:''}));let movies;try{const saved=JSON.parse(localStorage.getItem(key));movies=Array.isArray(saved)&&saved.every(x=>x&&typeof x.id==='string'&&typeof x.title==='string'&&grades.includes(x.grade))?saved:fresh()}catch{movies=fresh()}const tiers=document.getElementById('tiers'),message=document.getElementById('message'),detail=document.getElementById('detail'),grade=document.getElementById('grade'),memo=document.getElementById('memo'),stars=document.getElementById('stars');let selected=null,rating=null;function persist(){try{localStorage.setItem(key,JSON.stringify(movies))}catch{message.textContent='브라우저 저장소에 저장하지 못했습니다.'}}function render(){tiers.replaceChildren();for(const g of grades){const section=document.createElement('section');section.className='tier';section.dataset.tier=g;const label=document.createElement('div');label.className='tier-label';label.textContent=g;const drop=document.createElement('div');drop.className='drop';drop.dataset.grade=g;drop.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='move';drop.classList.add('over')});drop.addEventListener('dragleave',e=>{if(!drop.contains(e.relatedTarget))drop.classList.remove('over')});drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over');const id=e.dataTransfer.getData('text/plain');const item=movies.find(x=>x.id===id);if(item){item.grade=g;persist();render()}});const items=movies.filter(x=>x.grade===g);if(!items.length){const empty=document.createElement('span');empty.className='empty';empty.textContent='영화를 이곳으로 옮겨 보세요';drop.append(empty)}for(const item of items){const card=document.createElement('button');card.type='button';card.className='movie';card.draggable=true;const art=document.createElement('span');art.className='poster-art';art.setAttribute('aria-hidden','true');const top=document.createElement('span');top.className='poster-top';top.textContent='MY MOVIE';const bottom=document.createElement('span');bottom.className='poster-bottom';const name=document.createElement('span');name.className='poster-title';name.textContent=item.title;bottom.append(name);if(Number.isInteger(item.rating)&&item.rating>=1&&item.rating<=5){const score=document.createElement('span');score.className='poster-rating';score.textContent='★ '+item.rating+' / 5';bottom.append(score)}card.append(art,top,bottom);card.setAttribute('aria-label',item.title+' 상세 보기 및 등급 변경');card.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',item.id);e.dataTransfer.effectAllowed='move'});card.addEventListener('click',()=>openDetail(item.id));drop.append(card)}section.append(label,drop);tiers.append(section)}}function paintStars(){stars.replaceChildren();for(let n=1;n<=5;n++){const b=document.createElement('button');b.type='button';b.textContent='★ '+n;b.className=n===rating?'active':'';b.setAttribute('aria-pressed',String(n===rating));b.setAttribute('aria-label',n+'점');b.addEventListener('click',()=>{rating=rating===n?null:n;paintStars()});stars.append(b)}}function openDetail(id){const item=movies.find(x=>x.id===id);if(!item)return;selected=id;document.getElementById('detailTitle').textContent=item.title;grade.value=item.grade;memo.value=item.memo||'';rating=Number.isInteger(item.rating)&&item.rating>=1&&item.rating<=5?item.rating:null;paintStars();detail.showModal()}document.getElementById('close').addEventListener('click',()=>detail.close());document.getElementById('detailForm').addEventListener('submit',e=>{e.preventDefault();const item=movies.find(x=>x.id===selected);if(item){item.grade=grade.value;item.rating=rating;item.memo=memo.value;persist();render()}detail.close()});document.getElementById('add').addEventListener('submit',e=>{e.preventDefault();const input=document.getElementById('title');const title=input.value.trim();if(!title){message.textContent='영화 제목을 입력해 주세요.';return}if(movies.some(x=>x.title.toLocaleLowerCase('ko')===title.toLocaleLowerCase('ko'))){message.textContent='이미 목록에 있는 영화 제목입니다.';return}movies.push({id:'movie-'+Date.now()+'-'+Math.random().toString(36).slice(2),title,grade:'미분류',rating:null,memo:''});input.value='';message.textContent='';persist();render()});document.getElementById('reset').addEventListener('click',()=>{if(confirm('모든 영화 분류와 별점, 메모를 초기화할까요? 추가한 영화도 삭제됩니다.')){movies=fresh();message.textContent='';persist();render()}});render()})();
</script></body></html>
