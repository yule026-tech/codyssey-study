<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>나만의 영화 티어리스트</title>
<style>
:root{color-scheme:dark;--bg:#080d1b;--panel:#121c30;--line:#30405b;--text:#f4f5fa;--muted:#aab8ce;--gold:#e9c887}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1c2a46 0%,#080d1b 65%);color:var(--text);font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;min-height:100vh}main{max-width:1100px;margin:auto;padding:38px 18px 70px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:28px}h1{font-size:clamp(25px,4vw,38px);letter-spacing:-1px;margin:0}header p{color:var(--muted);margin:9px 0 0;font-size:14px}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.movie:focus-visible{outline:2px solid var(--gold);outline-offset:3px}.reset{background:transparent;color:#e9c8c8;border:1px solid #795666;border-radius:10px;padding:11px 16px}.tier{display:grid;grid-template-columns:90px minmax(0,1fr);border:1px solid var(--line);border-radius:13px;overflow:hidden;margin-bottom:12px;background:rgba(18,28,48,.87);min-height:114px}.tier-label{display:flex;align-items:center;justify-content:center;font-size:31px;font-weight:850;color:#101522}.tier[data-tier="S"] .tier-label{background:#eabf7e}.tier[data-tier="A"] .tier-label{background:#d7a5a7}.tier[data-tier="B"] .tier-label{background:#a7b9d6}.tier[data-tier="C"] .tier-label{background:#a8c7b5}.tier[data-tier="미분류"] .tier-label{background:#73849e;font-size:16px}.drop{padding:14px;display:flex;align-content:flex-start;align-items:flex-start;flex-wrap:wrap;gap:10px;min-width:0}.drop.over{background:#293b57;box-shadow:inset 0 0 0 2px var(--gold)}.movie{border:1px solid #455774;border-radius:9px;padding:12px 15px;background:#23314b;color:#fff;max-width:100%;overflow-wrap:anywhere;text-align:left;min-height:47px;cursor:grab}.movie:hover{border-color:var(--gold);background:#2b3e5b}.movie:active{cursor:grabbing}.empty{color:#788ba9;font-size:13px;align-self:center}.section-title{font-size:20px;margin:30px 0 14px;color:#f3e4c6}.add{display:flex;gap:10px;flex-wrap:wrap}.add input{flex:1;min-width:160px;background:#17243a;color:white;border:1px solid #465875;border-radius:10px;padding:13px}.primary{border:0;background:var(--gold);color:#1a2332;font-weight:750;border-radius:10px;padding:12px 21px}.message{min-height:22px;color:#f1b3b3;margin:9px 0 0;font-size:14px}dialog{width:min(460px,calc(100% - 30px));border:1px solid #53617b;border-radius:17px;padding:25px;background:#142139;color:var(--text);box-shadow:0 25px 90px #000b}dialog::backdrop{background:#000b}dialog h2{margin:0 0 20px;font-size:23px;overflow-wrap:anywhere}dialog label{display:block;margin:16px 0 7px;color:#d5ddec;font-size:14px}dialog select,dialog textarea{width:100%;background:#0c1729;color:white;border:1px solid #52627d;border-radius:9px;padding:11px}dialog textarea{min-height:100px;resize:vertical}.stars{display:flex;flex-wrap:wrap;gap:7px}.stars button{background:#1d2b43;color:#aebbd0;border:1px solid #485c79;border-radius:8px;padding:8px 11px}.stars button.active{color:#ffdb89;border-color:#e9c887;background:#37405a}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.secondary{background:transparent;color:#e7eaf1;border:1px solid #5c6a83;border-radius:10px;padding:11px 17px}@media(max-width:560px){main{padding:24px 12px}.tier{grid-template-columns:56px minmax(0,1fr);min-height:96px}.tier-label{font-size:23px}.tier[data-tier="미분류"] .tier-label{font-size:12px;writing-mode:vertical-rl}.drop{padding:10px;gap:8px}.movie{padding:10px;font-size:14px}header{align-items:flex-start}}
</style>
</head>
<body><main><header><div><h1>나만의 영화 티어리스트</h1><p>내가 본 영화를 취향대로 분류하고 기록해 보세요.</p></div><button class="reset" id="reset">전체 초기화</button></header><section id="tiers" aria-label="영화 등급별 목록"></section><h2 class="section-title">영화 추가</h2><form id="add" class="add"><input id="title" aria-label="새 영화 제목" placeholder="영화 제목을 입력하세요" autocomplete="off"><button class="primary">추가</button></form><p class="message" id="message" role="status"></p></main>
<dialog id="detail"><form method="dialog" id="detailForm"><h2 id="detailTitle"></h2><label for="grade">등급</label><select id="grade"><option>미분류</option><option>S</option><option>A</option><option>B</option><option>C</option></select><label>별점 (선택)</label><div class="stars" id="stars" aria-label="별점 선택"></div><label for="memo">짧은 감상평 또는 추천 이유 (선택)</label><textarea id="memo" placeholder="감상평이나 추천 이유를 적어 보세요"></textarea><div class="actions"><button type="button" class="secondary" id="close">취소</button><button class="primary" value="save">저장</button></div></form></dialog>
<script>
(()=>{'use strict';const initial=['인사이드 아웃','나우 유 씨 미','뷰티 인사이드','기생충','라라랜드','해리포터','왕과 사는 남자','나의 소녀시대'];const grades=['S','A','B','C','미분류'];const key='my-movie-tier-list-v1';const fresh=()=>initial.map((title,i)=>({id:'initial-'+i,title,grade:'미분류',rating:null,memo:''}));let movies;try{const saved=JSON.parse(localStorage.getItem(key));movies=Array.isArray(saved)&&saved.every(x=>x&&typeof x.id==='string'&&typeof x.title==='string'&&grades.includes(x.grade))?saved:fresh()}catch{movies=fresh()}const tiers=document.getElementById('tiers'),message=document.getElementById('message'),detail=document.getElementById('detail'),grade=document.getElementById('grade'),memo=document.getElementById('memo'),stars=document.getElementById('stars');let selected=null,rating=null;function persist(){try{localStorage.setItem(key,JSON.stringify(movies))}catch{message.textContent='브라우저 저장소에 저장하지 못했습니다.'}}function render(){tiers.replaceChildren();for(const g of grades){const section=document.createElement('section');section.className='tier';section.dataset.tier=g;const label=document.createElement('div');label.className='tier-label';label.textContent=g;const drop=document.createElement('div');drop.className='drop';drop.dataset.grade=g;drop.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='move';drop.classList.add('over')});drop.addEventListener('dragleave',e=>{if(!drop.contains(e.relatedTarget))drop.classList.remove('over')});drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over');const id=e.dataTransfer.getData('text/plain');const item=movies.find(x=>x.id===id);if(item){item.grade=g;persist();render()}});const items=movies.filter(x=>x.grade===g);if(!items.length){const empty=document.createElement('span');empty.className='empty';empty.textContent='영화를 이곳으로 옮겨 보세요';drop.append(empty)}for(const item of items){const card=document.createElement('button');card.type='button';card.className='movie';card.draggable=true;card.textContent=item.title;card.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',item.id);e.dataTransfer.effectAllowed='move'});card.addEventListener('click',()=>openDetail(item.id));drop.append(card)}section.append(label,drop);tiers.append(section)}}function paintStars(){stars.replaceChildren();for(let n=1;n<=5;n++){const b=document.createElement('button');b.type='button';b.textContent='★ '+n;b.className=n===rating?'active':'';b.setAttribute('aria-pressed',String(n===rating));b.setAttribute('aria-label',n+'점');b.addEventListener('click',()=>{rating=rating===n?null:n;paintStars()});stars.append(b)}}function openDetail(id){const item=movies.find(x=>x.id===id);if(!item)return;selected=id;document.getElementById('detailTitle').textContent=item.title;grade.value=item.grade;memo.value=item.memo||'';rating=Number.isInteger(item.rating)&&item.rating>=1&&item.rating<=5?item.rating:null;paintStars();detail.showModal()}document.getElementById('close').addEventListener('click',()=>detail.close());document.getElementById('detailForm').addEventListener('submit',e=>{e.preventDefault();const item=movies.find(x=>x.id===selected);if(item){item.grade=grade.value;item.rating=rating;item.memo=memo.value;persist();render()}detail.close()});document.getElementById('add').addEventListener('submit',e=>{e.preventDefault();const input=document.getElementById('title');const title=input.value.trim();if(!title){message.textContent='영화 제목을 입력해 주세요.';return}if(movies.some(x=>x.title.toLocaleLowerCase('ko')===title.toLocaleLowerCase('ko'))){message.textContent='이미 목록에 있는 영화 제목입니다.';return}movies.push({id:'movie-'+Date.now()+'-'+Math.random().toString(36).slice(2),title,grade:'미분류',rating:null,memo:''});input.value='';message.textContent='';persist();render()});document.getElementById('reset').addEventListener('click',()=>{if(confirm('모든 영화 분류와 별점, 메모를 초기화할까요? 추가한 영화도 삭제됩니다.')){movies=fresh();message.textContent='';persist();render()}});render()})();
</script></body></html>
